    DockerProbe:
      type: object
      additionalProperties: false
      required: [available, status]
      properties:
        available: {type: boolean}
        status: {type: string, enum: [unavailable, reachable, healthy]}
        server_version: {type: string}
        api_version: {type: string}
        os: {type: string}
        architecture: {type: string}
        error: {type: string}
    SSHHostKey:
      type: object
      additionalProperties: false
      required: [algorithm, fingerprint]
      properties:
        algorithm: {type: string, enum: [ssh-ed25519, ecdsa-sha2-nistp256, rsa-sha2-512]}
