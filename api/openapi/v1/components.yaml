        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    CreateDockerHostRequest:
      oneOf:
        - {$ref: '#/components/schemas/CreateLocalDockerHostRequest'}
        - {$ref: '#/components/schemas/CreateRemoteDockerHostRequest'}
      discriminator: {propertyName: transport}
    CreateLocalDockerHostRequest:
      type: object
      additionalProperties: false
      required: [name, transport, socket_path, root_equivalent_confirmation]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        transport: {type: string, enum: [local_unix]}
        socket_path: {type: string, enum: [/var/run/docker.sock]}
        root_equivalent_confirmation: {type: string, enum: [I UNDERSTAND DOCKER ACCESS IS ROOT-EQUIVALENT]}
    CreateRemoteDockerHostRequest:
      type: object
      additionalProperties: false
      required: [name, transport, socket_path, ssh_address, ssh_port, ssh_user, ssh_credential_ref, known_host_line, ssh_host_key]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        transport: {type: string, enum: [remote_ssh]}
        socket_path: {type: string, pattern: '^/'}
        ssh_address: {type: string}
        ssh_port: {type: integer, minimum: 1, maximum: 65535, default: 22}
        ssh_user: {type: string, minLength: 1, maxLength: 128}
        ssh_credential_ref:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          writeOnly: true
          description: Name of a private key already loaded through systemd encrypted credentials.
        known_host_line:
          type: string
          minLength: 64
          maxLength: 16384
          writeOnly: true
          description: Exact OpenSSH known_hosts line obtained through a trusted channel.
        ssh_host_key: {$ref: '#/components/schemas/SSHHostKey'}
    UpdateDockerHostRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        socket_path: {type: string, pattern: '^/'}
        ssh_address: {type: string}
        ssh_port: {type: integer, minimum: 1, maximum: 65535}
        ssh_user: {type: string}
        ssh_credential_ref:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          writeOnly: true
        known_host_line: {type: string, minLength: 64, maxLength: 16384, writeOnly: true}
        ssh_host_key: {$ref: '#/components/schemas/SSHHostKey'}
