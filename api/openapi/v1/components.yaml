        pids_limit: {type: integer, minimum: 16}
        environment: {type: object, maxProperties: 128, additionalProperties: {type: string, maxLength: 4096}}
        service_revision_ids: {type: array, maxItems: 20, uniqueItems: true, items: {$ref: '#/components/schemas/UUIDv7'}}
        network_profile_ids: {type: array, maxItems: 16, uniqueItems: true, items: {$ref: '#/components/schemas/UUIDv7'}}
