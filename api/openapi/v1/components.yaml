        name: {type: string, minLength: 1, maxLength: 128}
        transport: {$ref: '#/components/schemas/DockerTransport'}
        socket_path: {type: string, pattern: '^/'}
        ssh_address: {type: string}
        ssh_port: {type: integer, minimum: 1, maximum: 65535}
        ssh_user: {type: string}
        ssh_credential_ref: {type: string, writeOnly: true}
        ssh_host_key: {$ref: '#/components/schemas/SSHHostKey'}
