      type: object
      additionalProperties: false
      required: [backup_id, confirmation]
      properties:
        backup_id: {$ref: '#/components/schemas/UUIDv7'}
        confirmation: {type: string, pattern: '^RESTORE .+$'}
    CreatePurgeJobRequest:
      type: object
      additionalProperties: false
      required: [job_type, target_ids, parameters]
      properties:
        job_type: {type: string, enum: [purge]}
        target_ids: {type: array, minItems: 1, maxItems: 1, items: {type: string, enum: [manager]}}
        parameters: {$ref: '#/components/schemas/PurgeJobParameters'}
    PurgeJobParameters:
      type: object
      additionalProperties: false
      required: [resource_groups, confirmation]
      properties:
        resource_groups:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [configuration, database, credentials, cache, agents, containers, images, volumes, networks]}
        confirmation: {type: string, pattern: '^PURGE BORED MANAGER$'}
    CancelJobRequest:
      type: object
      additionalProperties: false
      properties:
        target_ids: {type: array, maxItems: 1000, uniqueItems: true, items: {type: string}}
        reason: {type: string, maxLength: 512}
