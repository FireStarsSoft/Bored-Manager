<!doctype html>
<!-- Starts dark because that is the default setting and what every file written
     before settings v5 is carried over as; applyTheme() corrects it once the
     settings arrive, which avoids a light flash on the way there. -->
<html lang="en" data-density="medium" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Kept in step with the header server/http.ts sends: the app now talks to
         its server over a WebSocket, which default-src alone would not allow. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:"
    />
    <title>Bored Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
