name: Trusted feasibility lab

on:
  workflow_dispatch:
    inputs:
      systemd_image:
        description: Digest-pinned Ubuntu 24.04 image
        required: true
        type: string
      dhcp_probe_image:
        description: Digest-pinned DHCP probe image
        required: true
        type: string

permissions:
  contents: read

jobs:
  certify:
    name: systemd and DHCP gates
    runs-on: [self-hosted, bored-manager-lab, ubuntu-24.04, amd64]
    environment: feasibility-lab
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BM_SYSTEMD_IMAGE: ${{ inputs.systemd_image }}
      BM_DHCP_PROBE_IMAGE: ${{ inputs.dhcp_probe_image }}
      BM_DHCP_DRIVER: ${{ vars.BM_DHCP_DRIVER }}
      BM_DHCP_PLUGIN_ID: ${{ vars.BM_DHCP_PLUGIN_ID }}
      BM_DHCP_VERIFY_ADAPTER: /usr/local/libexec/bored-manager-dhcp-gate
      BM_DHCP_OPTIONS_FILE: /etc/bored-manager-lab/dhcp-network.options
    steps:
      - name: Checkout trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Run blocking gates
        env:
          BM_GATE_EVIDENCE_ROOT: ${{ runner.temp }}
        run: bash lab/gates/run.sh
      - name: Preserve gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feasibility-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/bored-manager-feasibility.*
          if-no-files-found: error
          retention-days: 30
