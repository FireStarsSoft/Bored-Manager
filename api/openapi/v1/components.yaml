        job_type: {$ref: '#/components/schemas/JobType'}
        state: {$ref: '#/components/schemas/JobState'}
        requested_by: {type: string}
        idempotency_key: {type: string, minLength: 8, maxLength: 128}
        parameters: {$ref: '#/components/schemas/JobParameters'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        started_at: {allOf: [{$ref: '#/components/schemas/Timestamp'}], nullable: true}
        finished_at: {allOf: [{$ref: '#/components/schemas/Timestamp'}], nullable: true}
        targets: {type: array, items: {$ref: '#/components/schemas/JobTarget'}}
    CreateJobRequest:
      oneOf:
        - {$ref: '#/components/schemas/CreateCommandJobRequest'}
        - {$ref: '#/components/schemas/CreateServiceJobRequest'}
        - {$ref: '#/components/schemas/CreateProvisionJobRequest'}
        - {$ref: '#/components/schemas/CreateBackupJobRequest'}
        - {$ref: '#/components/schemas/CreateRestoreJobRequest'}
        - {$ref: '#/components/schemas/CreatePurgeJobRequest'}
      discriminator:
        propertyName: job_type
        mapping:
          command: '#/components/schemas/CreateCommandJobRequest'
          service: '#/components/schemas/CreateServiceJobRequest'
          provision: '#/components/schemas/CreateProvisionJobRequest'
          backup: '#/components/schemas/CreateBackupJobRequest'
          restore: '#/components/schemas/CreateRestoreJobRequest'
          purge: '#/components/schemas/CreatePurgeJobRequest'
    JobTargetIDs:
      type: array
      minItems: 1
      maxItems: 1000
      uniqueItems: true
      items: {type: string, minLength: 1, maxLength: 256}
    CreateCommandJobRequest:
      type: object
      additionalProperties: false
      required: [job_type, target_ids, parameters]
      properties:
        job_type: {type: string, enum: [command]}
        target_ids: {$ref: '#/components/schemas/JobTargetIDs'}
        parameters: {$ref: '#/components/schemas/CommandJobParameters'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    CommandJobParameters:
      type: object
      additionalProperties: false
      required: [argv, operating_system_user, timeout_seconds, barrier]
      properties:
        argv: {type: array, minItems: 1, maxItems: 128, items: {type: string, maxLength: 4096}}
        operating_system_user: {type: string, enum: [bored-shell, root]}
        working_directory: {type: string, maxLength: 4096}
        environment: {type: object, maxProperties: 64, additionalProperties: {type: string, maxLength: 4096}}
        timeout_seconds: {type: integer, minimum: 1, maximum: 86400}
        barrier: {type: boolean, default: false}
    CreateServiceJobRequest:
      type: object
      additionalProperties: false
      required: [job_type, target_ids, parameters]
      properties:
        job_type: {type: string, enum: [service]}
        target_ids: {$ref: '#/components/schemas/JobTargetIDs'}
        parameters: {$ref: '#/components/schemas/ServiceJobParameters'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    ServiceJobParameters:
      type: object
      additionalProperties: false
      required: [service_revision_id, action]
      properties:
        service_revision_id: {$ref: '#/components/schemas/UUIDv7'}
        action: {$ref: '#/components/schemas/ServiceActionType'}
    CreateProvisionJobRequest:
      type: object
      additionalProperties: false
      required: [job_type, target_ids, parameters]
      properties:
        job_type: {type: string, enum: [provision]}
        target_ids:
          description: Docker host identifiers.
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {$ref: '#/components/schemas/UUIDv7'}
        parameters: {$ref: '#/components/schemas/ProvisionJobParameters'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    ProvisionJobParameters:
      type: object
      additionalProperties: false
      required: [template_revision_id, count_per_host, naming_pattern, dry_run]
      properties:
        template_revision_id: {$ref: '#/components/schemas/UUIDv7'}
        count_per_host: {type: integer, minimum: 1, maximum: 800}
        naming_pattern: {type: string, minLength: 1, maxLength: 128}
        dry_run: {type: boolean, default: true}
    CreateBackupJobRequest:
      type: object
      additionalProperties: false
      required: [job_type, target_ids, parameters]
      properties:
        job_type: {type: string, enum: [backup]}
        target_ids: {type: array, minItems: 1, maxItems: 1, items: {type: string, enum: [manager]}}
        parameters: {$ref: '#/components/schemas/BackupJobParameters'}
    BackupJobParameters:
      type: object
      additionalProperties: false
      required: [include_encrypted_credentials]
      properties:
        include_encrypted_credentials: {type: boolean}
    CreateRestoreJobRequest:
      type: object
      additionalProperties: false
      required: [job_type, target_ids, parameters]
      properties:
        job_type: {type: string, enum: [restore]}
        target_ids: {type: array, minItems: 1, maxItems: 1, items: {type: string, enum: [manager]}}
        parameters: {$ref: '#/components/schemas/RestoreJobParameters'}
