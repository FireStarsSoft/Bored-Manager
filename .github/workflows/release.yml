name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash scripts/package.sh dist
      - run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
