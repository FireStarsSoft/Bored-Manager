name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked documentation tools
        run: npm ci
      - name: Audit documentation tools
        run: npm audit --audit-level=moderate
      - name: Markdown style
        run: npm run docs:lint
      - name: Bash snippets
        run: bash scripts/check-docs.sh
      - name: Release manifest schema/example
        run: go test ./docs/release
      - name: Links
        run: |
          while IFS= read -r document; do
            npx --no-install markdown-link-check --config .github/markdown-link-check.json "$document"
          done < <(find . -path './.git' -prune -o -path './node_modules' -prune -o -type f \( -name '*.md' -o -name '*.MD' \) -print)
      - name: Build bmctl
        run: go build -o bin/bmctl ./cmd/bmctl
      - name: Check documented CLI commands
        run: bash scripts/check-readme-cli.sh
